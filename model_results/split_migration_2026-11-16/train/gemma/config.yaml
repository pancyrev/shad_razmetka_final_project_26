    If no adult butterflies are present use "boxes": []. Copy the supplied photo_id
    as an integer and set error to null. For example, an object occupying x=20% through
    70% and y=10% through 60% would have {"left":0.2,"top":0.1,"width":0.5,"height":0.5}.
    This is an example of arithmetic only, not a proposed box for this image. The
    output boxes must come from this image. Locate every adult butterfly. Exclude
    moths, caterpillars, pupae, other insects, flowers and shadows. Return one tight
    axis-aligned rectangle for each butterfly, including all its visible wings, body,
    antennae and legs. For occluded or cropped animals, box the visible part only. '
  output_prompt: 'Find every adult butterfly in the image. Include only adult butterflies;
    exclude moths, caterpillars, pupae, other insects, shadows and flowers. Draw one
    tight axis-aligned bounding box per butterfly, enclosing all visible wings, body,
    antennae and legs. For occluded or cropped butterflies enclose only visible parts;
    do not invent hidden parts. Return exactly one line of valid JSON (one JSONL record),
    with no Markdown, code fences, explanations, confidence scores or additional keys.
    The record must have exactly these keys: "photo_id" (the integer ID supplied below),
