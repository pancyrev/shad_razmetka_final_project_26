  prompt: 'Locate every adult butterfly, including skippers, with one tight rectangular
    box enclosing the complete visible wings, body, antennae and legs. Exclude moths,
    caterpillars, pupae, other insects and background objects. For cropped or occluded
    butterflies include only the visible parts. For each butterfly, inspect its leftmost
    visible point, highest point, rightmost point and lowest point. Use those four
    outer edges, not the center or a single wing. The full box must cover the entire
    butterfly and as little background as possible. left is the fraction of image
    width BEFORE the insect, top is the fraction of image height ABOVE it. width is
    the fraction of image width OCCUPIED by the whole insect, height the fraction
    of image height OCCUPIED by it. These are four separate named values. Return exactly
    one line of valid JSON (one JSONL record), with no Markdown, code fences, explanations,
    confidence scores or additional keys. The record must have exactly these keys:
    "photo_id" (the integer ID supplied below), "boxes" (an array of boxes), and "error"
    (null). Each box must have exactly four numeric fields: "left", "top", "width",
    "height". Coordinates are normalized to the original image: left=x_min/image_width,
    top=y_min/image_height, width=(x_max-x_min)/image_width, height=(y_max-y_min)/image_height.
    The origin is the top-left corner. All numbers must be finite; left and top must
    be at least 0, width and height must be strictly positive, and left+width<=1 and
    top+height<=1. Use decimals in [0,1], never pixels or a 0-1000 scale. If there
    are no adult butterflies, return "boxes": []. Example structure (not the answer
    to this image): {"photo_id":123,"boxes":[{"left":0.1,"top":0.2,"width":0.3,"height":0.4}],"error":null}.
    The first character of your response must be { and the last character must be
    }. Do not wrap the JSON in triple backticks or code fences.'
