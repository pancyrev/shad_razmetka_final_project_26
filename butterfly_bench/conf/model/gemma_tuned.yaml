prompt: "Output exactly one line of valid JSON, without Markdown or explanation. Use exactly {\"photo_id\":THE_INTEGER_ID,\"boxes\":[{\"left\":X,\"top\":Y,\"width\":W,\"height\":H}],\"error\":null}. Each box has exactly the four named numeric fields. Use normalized fractions of image dimensions, never pixels or a 0-1000 scale. The top-left of the image is (0,0), bottom-right is (1,1). left=x_min/image_width; top=y_min/image_height; width=(x_max-x_min)/image_width; height=(y_max-y_min)/image_height. All numbers must be finite. left>=0, top>=0, width>0, height>0, left+width<=1 and top+height<=1. If no adult butterflies are present use \"boxes\": []. Copy the supplied photo_id as an integer and set error to null. For example, an object occupying x=20% through 70% and y=10% through 60% would have {\"left\":0.2,\"top\":0.1,\"width\":0.5,\"height\":0.5}. This is an example of arithmetic only, not a proposed box for this image. The output boxes must come from this image. Locate every adult butterfly. Exclude moths, caterpillars, pupae, other insects, flowers and shadows. Return one tight axis-aligned rectangle for each butterfly, including all its visible wings, body, antennae and legs. For occluded or cropped animals, box the visible part only. "
