  prompt: 'Locate every adult butterfly, including skippers, with one tight rectangular
    box enclosing the complete visible wings, body, antennae and legs. Exclude moths,
    caterpillars, pupae, other insects and background objects. For cropped or occluded
    butterflies include only the visible parts. Estimate what percentage of the FULL
    image lies to the left of the butterfly, above it, and what percentage of the
    FULL image its total width and height occupy. Divide those percentages by 100
    to obtain left, top, width, height. For example, a box occupying 60% of image
    width must have width 0.60, not 0.30 or 60. Look carefully at wings extending
    sideways; do not restrict the box to the body or one wing. Do all calculations
    silently. Return exactly one line of valid JSON (one JSONL record), with no Markdown,
    code fences, explanations, confidence scores or additional keys. The record must
    have exactly these keys: "photo_id" (the integer ID supplied below), "boxes" (an
    array of boxes), and "error" (null). Each box must have exactly four numeric fields:
    "left", "top", "width", "height". Coordinates are normalized to the original image:
    left=x_min/image_width, top=y_min/image_height, width=(x_max-x_min)/image_width,
    height=(y_max-y_min)/image_height. The origin is the top-left corner. All numbers
    must be finite; left and top must be at least 0, width and height must be strictly
    positive, and left+width<=1 and top+height<=1. Use decimals in [0,1], never pixels
    or a 0-1000 scale. If there are no adult butterflies, return "boxes": []. Example
    structure (not the answer to this image): {"photo_id":123,"boxes":[{"left":0.1,"top":0.2,"width":0.3,"height":0.4}],"error":null}.
    The first character of your response must be { and the last character must be
    }. Do not wrap the JSON in triple backticks or code fences.'
  output_prompt: 'Find every adult butterfly in the image. Include only adult butterflies;
