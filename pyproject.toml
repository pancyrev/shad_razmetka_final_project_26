[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "butterfly-bench"
version = "0.1.0"
description = "Reproducible CUDA butterfly detection evaluation and inference"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.7", "torchvision>=0.22", "transformers==5.23.0",
  "huggingface-hub>=1.0", "datasets>=4", "hydra-core==1.3.2",
  "comet-ml==3.58.12", "Pillow>=12", "requests>=2.32",
  "python-dotenv>=1.2", "numpy>=2", "accelerate>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "nbformat>=5", "nbclient>=0.10", "ipykernel>=6", "matplotlib>=3.10", "cmake>=3.28", "ninja>=1.11"]

[project.scripts]
butterfly-bench = "butterfly_bench.cli:main"

[tool.setuptools.packages.find]
include = ["butterfly_bench*"]

[tool.setuptools.package-data]
butterfly_bench = ["conf/*.yaml", "conf/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

